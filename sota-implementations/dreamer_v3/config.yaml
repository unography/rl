env:
  name: Pendulum-v1
  seed: 0
  device: cpu

collector:
  frames_per_batch: 200
  total_frames: 5000
  exploration: random  # one of: random, mode

replay_buffer:
  buffer_size: 10000
  batch_size: 16
  seq_len: 16
  warmup_factor: 2  # collect (warmup_factor * batch_size * seq_len) frames before training

networks:
  state_dim: 16
  rnn_hidden_dim: 32
  num_categoricals: 4
  num_classes: 4
  obs_embed_dim: 32
  num_reward_bins: 41
  num_value_bins: 255  # two-hot critic (DreamerV3 symexp_twohot); finer than reward for the wider value range
  hidden_dim: 64
  depth: 2
  unimix: 0.01
  jax_core: true  # DreamerV3 block GRU (sigmoid(update-1), action clip, RMSNorm inputs)
  blocks: 8       # rnn_hidden_dim must be divisible by this
  actor_minstd: 0.1  # DreamerV3 bounded_normal std bounds
  actor_maxstd: 1.0

optimization:
  optimizer: dreamerv3  # adam | dreamerv3 (AGC + RMS + momentum + warmup)
  agc: 0.3
  opt_warmup: 100  # reference uses 1000 for large-scale runs; shorter for this toy
  lr: 3.0e-4  # reference lr is 4e-5 at scale; 3e-4 keeps this toy learning quickly
  grad_clip: 100.0
  updates_per_batch: 8
  imagination_horizon: 10
  use_reinforce: true
  free_bits: 1.0
  kl_alpha: 0.8
  kl_dyn_scale: 1.0  # DreamerV3 loss_scales dyn=1.0 / rep=0.1 (overrides kl_alpha)
  kl_rep_scale: 0.1
  lambda_continue: 1.0  # continue/termination head loss scale (DreamerV3 con=1.0)
  gamma: 0.99
  lmbda: 0.95
  imag_loss: true   # faithful DreamerV3 imag_loss transcription (lambda_return + weight + sg)
  horizon: 100      # disc = 1 - 1/horizon when contdisc=false
  contdisc: false   # false -> geometric disc from horizon; continue head still gates termination

logger:
  eval_every: 500
  eval_episodes: 3
  output_plot: dreamer_v3_pendulum.png
