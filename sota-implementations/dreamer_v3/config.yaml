# Names recorded in the run manifest. The protocol/ and model_size/ config
# groups set them; the Pendulum smoke configuration uses neither.
protocol: null
model_size: null

env:
  backend: gym
  name: Pendulum-v1
  task: null
  seed: 0
  use_seed: true
  max_episode_steps: 200
  # vector: the concatenated proprioceptive observation under "observation".
  # image: one HWC uint8 image under "pixels" (dm_control only).
  observation_mode: vector
  image_size: [64, 64]  # [height, width] of image observations
  camera_id: 0  # a camera index, or a camera name of the MuJoCo model

collector:
  num_envs: 1
  frames_per_batch: 200
  total_frames: 5000
  count_reset_records: false
  exploration: random  # one of: random, mode

replay_buffer:
  device: cpu  # null keeps replay on the training device
  buffer_size: 10000
  batch_size: 16
  seq_len: 16
  online: true
  warmup_factor: 2  # collect (warmup_factor * batch_size * seq_len) frames before training
  # Host memory a CPU replay may use, checked at startup; null reads the
  # physical memory of the machine.
  host_memory_limit_gb: null

networks:
  rnn_hidden_dim: 32
  num_categoricals: 4
  num_classes: 4
  unimix: 0.01
  recurrent_model: block_gru
  num_blocks: 8
  dynamics_layers: 1
  prior_layers: 2
  posterior_layers: 1
  norm_eps: 1.0e-4
  # Sizes of the per-observation decoder heads, summing to the observation
  # size. null builds a single head over the whole observation.
  decoder_event_dims: null
  num_reward_bins: 255
  num_value_bins: 255
  hidden_dim: 64
  encoder_layers: 3
  decoder_layers: 3
  reward_layers: 1
  actor_layers: 3
  value_layers: 3
  policy_min_std: 0.1
  policy_max_std: 1.0
  # Image encoder and decoder: base channel depth, per-stage multipliers of
  # it, convolution kernel size and the block-linear groups that project the
  # deterministic state into the decoder's smallest feature map.
  image_depth: 64
  image_depth_multipliers: [2, 3, 4, 4]
  image_kernel_size: 5
  decoder_spatial_blocks: 8

optimization:
  device: null       # training device (models, losses, policy). null=auto
  deferred_policy_sync: false
  separate_policy_rng: false
  mixed_precision: false
  # Compile the RSSM recurrence: null, "step" or "scan". "scan" is faster but
  # changes the random stream; see the README.
  compile_rssm: null
  # Number of RSSM steps traced per higher-order scan iteration.
  rssm_scan_unroll: 8
  lr: 4.0e-5
  optimizer_eps: 1.0e-20
  adaptive_grad_clip: 0.3
  warmup_steps: 1000
  updates_per_batch: 8
  train_ratio: null
  imagination_horizon: 15
  continuation_horizon: 333
  use_reinforce: true
  return_normalization_rate: 0.01
  return_normalization_min_scale: 1.0
  slow_critic_regularization: 1.0
  slow_critic_tau: 0.02
  replay_value_loss_weight: 0.3
  free_bits: 1.0
  dynamic_loss_weight: 1.0
  representation_loss_weight: 0.1
  gamma: 1.0
  lmbda: 0.95

logger:
  train_every: 200
  eval_every: 500
  eval_episodes: 3
  output_plot: dreamer_v3_pendulum.png
  metrics_jsonl: null

hydra:
  job:
    chdir: true
