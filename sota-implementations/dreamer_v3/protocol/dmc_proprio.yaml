# @package _global_
# The pinned JAX dmc_proprio preset: schedule, replay and optimizer settings.
# Task presets select it in their defaults list and set only the task.
protocol: dmc_proprio

# The reference uses action repeat 1, which is what the environment does.
env:
  observation_mode: vector
  max_episode_steps: 1000

collector:
  num_envs: 16
  frames_per_batch: 16
  # Match the pinned JAX implementation's driver counter, which includes
  # initial and reset-only records.
  count_reset_records: true
  total_frames: 1100000

replay_buffer:
  # Keep sampled sequences and latent-context refreshes on the learner device.
  device: null
  buffer_size: 5000000
  batch_size: 16
  seq_len: 64
  online: true
  # Warmup gates on 65-record windows, so 128 records per stream gives 1024.
  warmup_factor: 2

networks:
  num_categoricals: 32

optimization:
  deferred_policy_sync: true
  separate_policy_rng: true
  mixed_precision: true
  train_ratio: 1024

logger:
  # Approximately the JAX implementation's 120-second learner logging cadence.
  train_every: 4096
  # The JAX curve uses the stochastic train_episode returns; the
  # evaluator adds a deterministic return on a separate environment.
  eval_every: 10000
  eval_episodes: 5

# Read by benchmark.py: the seeds it runs and the window it aggregates over.
# Each task preset sets minimum_final_median_return once a baseline exists.
benchmark:
  seeds: [0, 1, 2]
  window_size: 50000
  minimum_final_median_return: null
